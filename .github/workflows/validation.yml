name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  numerical-and-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install numerical dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Compile Python sources
        run: >-
          python -m py_compile
          neural_training_numpy.py
          neural_network_learning_numpy.py
          validate_neural_training.py
          validate_neural_video.py
          validate_public_release.py
          slow_video_2x.py
      - name: Validate numerical training
        run: python validate_neural_training.py
      - name: Validate public documentation and notebook
        run: python validate_public_release.py --execute-notebook
